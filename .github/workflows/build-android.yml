name: Android APK

# main'e her push'ta (ve Actions sekmesinden elle) Android APK derler.
# Derleme kaydı ve APK, "ci-output" dalına yazılır (her derlemede üzerine yazılır).
# "faz-*" dallarının çıktısı main'inkini ezmesin diye "ci-output-<dal>" dalına yazılır.
on:
  push:
    branches: [main, 'faz-*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Makinedeki NDK'yı seç
        run: |
          ls "$ANDROID_HOME/ndk" || true
          NDK=$(ls "$ANDROID_HOME/ndk" | sort -V | tail -1)
          echo "Kullanılacak NDK: $NDK"
          echo "ANDROID_NDK_VERSION=$NDK" >> "$GITHUB_ENV"

      - name: Platform klasörlerini oluştur
        id: platform
        continue-on-error: true
        run: |
          set -o pipefail
          {
            flutter create --org com.bicen --project-name future_meeting_notes --platforms android,ios . &&
            rm -f test/widget_test.dart &&
            python3 scripts/setup_platforms.py &&
            { grep -n "ndkVersion\|minSdk" android/app/build.gradle* || true; }
          } 2>&1 | tee platform.log

      - name: Paketler
        id: pub
        if: steps.platform.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee pub.log

      - name: Kod analizi
        id: analyze
        if: steps.pub.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log

      - name: Testler
        id: test
        if: steps.pub.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          flutter test 2>&1 | tee test.log

      - name: APK derle (arm64 — güncel Android telefonlar)
        id: build
        if: steps.analyze.outcome == 'success' && steps.test.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          flutter build apk --release --target-platform android-arm64 --build-number=$((100 + GITHUB_RUN_NUMBER)) 2>&1 \
            | grep --line-buffered -vE '^\[=* *\] *[0-9]+%' | tee build.log

      - name: Kaydı ve APK'yı ci-output dalına yaz
        if: always()
        run: |
          mkdir -p /tmp/out
          {
            echo "commit: $GITHUB_SHA"
            echo "platform: ${{ steps.platform.outcome }}"
            echo "pub: ${{ steps.pub.outcome }}"
            echo "analyze: ${{ steps.analyze.outcome }}"
            echo "test: ${{ steps.test.outcome }}"
            echo "build: ${{ steps.build.outcome }}"
            echo "flutter: $(flutter --version | head -1)"
            echo "ndk: $ANDROID_NDK_VERSION"
            grep -n "ndkVersion\|minSdk\|Minify\|Shrink\|signingConfig =" android/app/build.gradle* || true
            echo "build-number: $((100 + GITHUB_RUN_NUMBER))"
            [ -f build/app/outputs/flutter-apk/app-release.apk ] && \
              keytool -printcert -jarfile build/app/outputs/flutter-apk/app-release.apk | grep -E "Owner|SHA256:" || true
          } > /tmp/out/STATUS.txt
          [ -f build.log ] && tail -n 400 build.log > /tmp/out/build.log || true
          for f in platform.log pub.log analyze.log test.log; do [ -f $f ] && tail -n 300 $f > /tmp/out/$f || true; done
          [ -f build/app/outputs/flutter-apk/app-release.apk ] && \
            cp build/app/outputs/flutter-apk/app-release.apk /tmp/out/future-meeting-notes.apk || true
          cd /tmp/out
          OUT_BRANCH=ci-output
          [ "$GITHUB_REF_NAME" != "main" ] && OUT_BRANCH="ci-output-$GITHUB_REF_NAME"
          git init -q -b "$OUT_BRANCH"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "CI çıktısı: $GITHUB_SHA (${{ steps.build.outcome }})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "$OUT_BRANCH"

      - name: Bir adım başarısızsa işi başarısız say
        if: steps.platform.outcome != 'success' || steps.pub.outcome != 'success' || steps.analyze.outcome != 'success' || steps.test.outcome != 'success' || steps.build.outcome != 'success'
        run: exit 1
