name: Android APK

# main'e her push'ta (ve Actions sekmesinden elle) Android APK derler.
# Derleme kaydı ve APK, "ci-output" dalına yazılır (her derlemede üzerine yazılır).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Makinedeki NDK'yı seç
        run: |
          ls "$ANDROID_HOME/ndk" || true
          NDK=$(ls "$ANDROID_HOME/ndk" | sort -V | tail -1)
          echo "Kullanılacak NDK: $NDK"
          echo "ANDROID_NDK_VERSION=$NDK" >> "$GITHUB_ENV"

      - name: Platform klasörlerini oluştur
        run: |
          flutter create --org com.bicen --project-name future_meeting_notes --platforms android,ios .
          rm -f test/widget_test.dart
          python3 scripts/setup_platforms.py
          grep -n "ndkVersion\|minSdk" android/app/build.gradle* || true

      - name: Paketler
        run: flutter pub get

      - name: Kod analizi
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Testler
        run: flutter test

      - name: APK derle (arm64 — güncel Android telefonlar)
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          flutter build apk --release --target-platform android-arm64 2>&1 \
            | grep --line-buffered -vE '^\[=* *\] *[0-9]+%' | tee build.log

      - name: Kaydı ve APK'yı ci-output dalına yaz
        if: always()
        run: |
          mkdir -p /tmp/out
          {
            echo "commit: $GITHUB_SHA"
            echo "build: ${{ steps.build.outcome }}"
            echo "flutter: $(flutter --version | head -1)"
            echo "ndk: $ANDROID_NDK_VERSION"
            grep -n "ndkVersion\|minSdk\|Minify\|Shrink" android/app/build.gradle* || true
          } > /tmp/out/STATUS.txt
          [ -f build.log ] && tail -n 400 build.log > /tmp/out/build.log || true
          [ -f build/app/outputs/flutter-apk/app-release.apk ] && \
            cp build/app/outputs/flutter-apk/app-release.apk /tmp/out/future-meeting-notes.apk || true
          cd /tmp/out
          git init -q -b ci-output
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "CI çıktısı: $GITHUB_SHA (${{ steps.build.outcome }})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-output

      - name: Derleme başarısızsa işi başarısız say
        if: steps.build.outcome == 'failure'
        run: exit 1
